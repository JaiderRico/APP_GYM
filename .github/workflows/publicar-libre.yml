# Publica "Mi Progreso Libre" (la app pública, com.jaider.gimnasio.libre) desde publica/vX.Y.Z/
# - Firma la APK con el mismo secreto FIRMA_PEM si no viene firmada.
# - La sube al Release fijo "publica" como MiProgreso_Libre.apk, así el enlace que comparten las apps no cambia:
#   https://github.com/JaiderRico/APP_GYM/releases/download/publica/MiProgreso_Libre.apk
# - Ese Release es PRE-RELEASE y nunca "Latest": así las apps de Jaider y de Ella no lo ven al buscar
#   actualizaciones (ellas solo miran Releases normales). La app libre sí lo mira y toma la versión del título.
name: Publicar app libre

on:
  push:
    branches: [main]
    paths: ['publica/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-libre
  cancel-in-progress: false

env:
  CERT_SHA256: f7d6a22c1b257de37f8d7fa134e6b5755c1a94cb2d996648809fabda31fa0d7d
  TAG_FIJO: publica

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar herramientas de firma
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BT=""
          [ -n "$SDK" ] && BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$BT" ] || [ ! -x "$BT/apksigner" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq apksigner zipalign
            echo "APKSIGNER=apksigner" >> "$GITHUB_ENV"; echo "ZIPALIGN=zipalign" >> "$GITHUB_ENV"
          else
            echo "APKSIGNER=$BT/apksigner" >> "$GITHUB_ENV"; echo "ZIPALIGN=$BT/zipalign" >> "$GITHUB_ENV"
          fi

      - name: Elegir versión
        run: |
          set -euo pipefail
          shopt -s nullglob
          DIRS=(publica/v*/)
          [ ${#DIRS[@]} -gt 0 ] || { echo "No hay carpetas publica/vX.Y.Z"; exit 1; }
          DIR=$(printf '%s\n' "${DIRS[@]%/}" | sort -V | tail -1)
          VER=$(basename "$DIR"); VER=${VER#v}
          APK="$DIR/MiProgreso_Libre_v$VER.apk"
          [ -f "$APK" ] || { echo "::error::Falta $APK"; exit 1; }
          echo "DIR=$DIR" >> "$GITHUB_ENV"; echo "VER=$VER" >> "$GITHUB_ENV"; echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Firmar si hace falta
        env:
          FIRMA_PEM: ${{ secrets.FIRMA_PEM }}
        run: |
          set -euo pipefail
          K="$RUNNER_TEMP/firma"; mkdir -p "$K"; chmod 700 "$K"
          trap 'rm -rf "$K"' EXIT
          tiene_cert() { "$APKSIGNER" verify --print-certs "$1" > "$K/v.txt" 2>/dev/null || true; grep -q "$CERT_SHA256" "$K/v.txt"; }
          if tiene_cert "$APK"; then echo "Ya firmada: $APK"; else
            [ -n "${FIRMA_PEM:-}" ] || { echo "::error::Falta el secreto FIRMA_PEM."; exit 1; }
            (umask 077; printf '%s\n' "$FIRMA_PEM" > "$K/clave.pem")
            openssl pkcs8 -topk8 -nocrypt -in "$K/clave.pem" -outform DER -out "$K/key.pk8"
            openssl x509 -in "$K/clave.pem" -outform DER -out "$K/cert.der"
            rm -f "$K/clave.pem"
            "$ZIPALIGN" -f -p 4 "$APK" "$K/alineada.apk"
            "$APKSIGNER" sign --v4-signing-enabled false --key "$K/key.pk8" --cert "$K/cert.der" --out "$K/firmada.apk" "$K/alineada.apk"
            tiene_cert "$K/firmada.apk" || { echo "::error::El certificado no coincide"; exit 1; }
            mv "$K/firmada.apk" "$APK"
          fi
          cp "$APK" "$RUNNER_TEMP/MiProgreso_Libre.apk"

      - name: Subir al Release fijo "publica" (pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES=(--notes "Mi Progreso Libre $VER")
          [ -f "$DIR/notas.md" ] && NOTES=(--notes-file "$DIR/notas.md")
          TITLE="Mi Progreso Libre $VER"
          if gh release view "$TAG_FIJO" >/dev/null 2>&1; then
            gh release upload "$TAG_FIJO" "$RUNNER_TEMP/MiProgreso_Libre.apk" --clobber
            gh release edit "$TAG_FIJO" --title "$TITLE" --prerelease --latest=false "${NOTES[@]}"
          else
            gh release create "$TAG_FIJO" "$RUNNER_TEMP/MiProgreso_Libre.apk" --target "$GITHUB_SHA" --title "$TITLE" --prerelease --latest=false "${NOTES[@]}"
          fi
          gh release view "$TAG_FIJO" --json tagName,name,isPrerelease,assets --jq '{tag:.tagName,name:.name,pre:.isPrerelease,apks:[.assets[].name]}'
          echo "Enlace: https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG_FIJO/MiProgreso_Libre.apk"
